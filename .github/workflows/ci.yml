# Checks-only CI. Deployment is handled by Deno Deploy's native GitHub
# integration (build command: `deno task build`), which reacts to pushes
# on its own.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check **/*.ts && deno check **/*.tsx

      - name: Renderer TypeScript tests
        run: deno test --allow-read renderer/tests/

      - name: Build (artifact fetch + Fresh build, no deploy)
        run: deno task build
